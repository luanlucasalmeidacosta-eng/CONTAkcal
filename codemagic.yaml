workflows:
  android-build:
    name: CONTAkcal — Android (APK debug)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: latest
      vars:
        VITE_FIREBASE_API_KEY: $VITE_FIREBASE_API_KEY
        VITE_FIREBASE_AUTH_DOMAIN: $VITE_FIREBASE_AUTH_DOMAIN
        VITE_FIREBASE_PROJECT_ID: $VITE_FIREBASE_PROJECT_ID
        VITE_FIREBASE_STORAGE_BUCKET: $VITE_FIREBASE_STORAGE_BUCKET
        VITE_FIREBASE_MESSAGING_SENDER_ID: $VITE_FIREBASE_MESSAGING_SENDER_ID
        VITE_FIREBASE_APP_ID: $VITE_FIREBASE_APP_ID
    scripts:
      - name: Instalar dependências e buildar o web
        script: |
          npm ci
          npm run build
      - name: Sincronizar Capacitor (Android)
        script: npx cap sync android
      - name: Buildar APK debug
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-build:
    name: CONTAkcal — iOS (simulador, sem assinatura)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        VITE_FIREBASE_API_KEY: $VITE_FIREBASE_API_KEY
        VITE_FIREBASE_AUTH_DOMAIN: $VITE_FIREBASE_AUTH_DOMAIN
        VITE_FIREBASE_PROJECT_ID: $VITE_FIREBASE_PROJECT_ID
        VITE_FIREBASE_STORAGE_BUCKET: $VITE_FIREBASE_STORAGE_BUCKET
        VITE_FIREBASE_MESSAGING_SENDER_ID: $VITE_FIREBASE_MESSAGING_SENDER_ID
        VITE_FIREBASE_APP_ID: $VITE_FIREBASE_APP_ID
    scripts:
      - name: Instalar dependências e buildar o web
        script: |
          npm ci
          npm run build
      - name: Sincronizar Capacitor (iOS)
        script: npx cap sync ios
      - name: Buildar para simulador (não requer certificado Apple)
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Build/Products/**/*.app
