workflows:
  android-build:
    name: CONTAkcal — Android (APK debug)
    max_build_duration: 30
    environment:
      node: latest
      java: 21
      groups:
        - firebase_env
    scripts:
      - name: Instalar dependências e buildar o web
        script: |
          npm ci
          npm run build
      - name: Sincronizar Capacitor (Android)
        script: npx cap sync android
      - name: Buildar APK debug
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-build:
    name: CONTAkcal — iOS (simulador, sem assinatura)
    max_build_duration: 45
    environment:
      node: latest
      xcode: latest
      groups:
        - firebase_env
    scripts:
      - name: Instalar dependências e buildar o web
        script: |
          npm ci
          npm run build
      - name: Sincronizar Capacitor (iOS)
        script: npx cap sync ios
      - name: Buildar para simulador (não requer certificado Apple)
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
    artifacts:
      - ios/App/build/Build/Products/**/*.app

  ios-device-build:
    name: CONTAkcal — iOS (.ipa não assinado, pra sideload)
    max_build_duration: 45
    environment:
      node: latest
      xcode: latest
      groups:
        - firebase_env
    scripts:
      - name: Instalar dependências e buildar o web
        script: |
          npm ci
          npm run build
      - name: Sincronizar Capacitor (iOS)
        script: npx cap sync ios
      - name: Buildar para dispositivo real, sem assinatura
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphoneos -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Empacotar como .ipa (não assinado — assine com Sideloadly antes de instalar)
        script: |
          cd ios/App/build/Build/Products/Debug-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r ../../../../../../CONTAkcal-unsigned.ipa Payload
    artifacts:
      - CONTAkcal-unsigned.ipa
